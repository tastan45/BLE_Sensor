<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE IoT Gateway - Sensör Bağlantısı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Xiaomi LYWSD03MMC Web Bluetooth Bağlantısı</h2>
    <p>Android Bluetooth yığını kilitlenmesini önleyen kararlı arayüz.</p>
    
    <button onclick="connectSensor()">Sensöre Bağlan</button>
    <div id="status">Bağlantı bekleniyor...</div>

    <script>
        async function connectSensor() {
            const statusDiv = document.getElementById("status");
            try {
                statusDiv.innerText = "Cihaz taranıyor...";
                console.log("Cihaz taranıyor...");
                
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        'ebe0ccc0-7a0a-4b0c-8a1a-6ff2997da3a6', 
                        '0000181a-0000-1000-8000-00805f9b34fb', 
                        '0000ffe0-0000-1000-8000-00805f9b34fb', 
                        '00001800-0000-1000-8000-00805f9b34fb', 
                        '00001801-0000-1000-8000-00805f9b34fb'  
                    ]
                });

                statusDiv.innerText = "Cihaz seçildi: " + (device.name || "İsimsiz Cihaz");
                console.log("Cihaz seçildi:", device.name);
                
                // Android yığınını rahatlatmak için bağlantı öncesi kısa bir gecikme
                await new Promise(resolve => setTimeout(resolve, 500));

                let server = null;
                let attempts = 3;
                
                for (let i = 1; i <= attempts; i++) {
                    try {
                        statusDiv.innerText = `GATT bağlantısı deneniyor (${i}/${attempts})...`;
                        console.log(`Bağlantı denemesi: ${i}`);
                        
                        if (device.gatt.connected) {
                            await device.gatt.disconnect();
                        }
                        
                        server = await device.gatt.connect();
                        break;
                    } catch (connErr) {
                        console.warn(`Deneme ${i} başarısız:`, connErr);
                        if (i === attempts) throw connErr;
                        await new Promise(resolve => setTimeout(resolve, 2000));
                    }
                }

                statusDiv.innerText = "GATT sunucusuna bağlandı, servisler taranıyor...";
                console.log("GATT Sunucusuna başarıyla bağlanıldı.");

                const services = await server.getPrimaryServices();
                console.log("Bulunan servis sayısı:", services.length);

                if (services && services.length > 0) {
                    const targetService = services[0];
                    statusDiv.innerText = "Bağlantı Başarılı! Servis UUID: " + targetService.uuid;
                    console.log("Kullanılan Servis UUID:", targetService.uuid);
                } else {
                    throw new Error("Cihaz herhangi bir servis döndürmedi.");
                }
                
            } catch (error) {
                statusDiv.innerText = "Hata oluştu: " + error.message;
                console.error("Bağlantı hatası:", error);
            }
        }
    </script>

</body>
</html>
