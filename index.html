<!-- MJ_HT_V1 Dashboard v4.0 -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ_HT_V1 BLE Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f9f9f9;
            color: #333;
        }

        .card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.12);
            max-width: 420px;
            margin: auto;
        }

        .version {
            font-size: 12px;
            color: #666;
            padding: 7px 9px;
            background: #eee;
            margin-bottom: 12px;
            border-radius: 5px;
        }

        .metric {
            font-size: 20px;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            color: white;
            background: #087ff5;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #log {
            font-size: 11px;
            background: #eee;
            padding: 9px;
            margin-top: 12px;
            border-radius: 5px;
            max-height: 240px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="version">
        Arayüz Sürümü: v4.0
    </div>

    <h2>MJ_HT_V1 Sensör Takip</h2>

    <button id="connectButton" onclick="connectSensor()">
        Sensörü Seç ve Başlat
    </button>

    <button id="disconnectButton" onclick="disconnectSensor()" disabled>
        Bağlantıyı Kes
    </button>

    <div class="metric">
        Sıcaklık: <span id="temp">--</span>
    </div>

    <div class="metric">
        Nem: <span id="humidity">--</span>
    </div>

    <div class="metric">
        Pil: <span id="battery">--</span>
    </div>

    <div id="log">Loglar burada görünecek...</div>

</div>

<script>
const BATTERY_SERVICE_UUID = 'battery_service';
const BATTERY_CHARACTERISTIC_UUID = 'battery_level';

let bluetoothDevice = null;

function logMessage(message) {
    const logElement = document.getElementById('log');
    const time = new Date().toLocaleTimeString('tr-TR');

    logElement.innerText += `\n[${time}] ${message}`;
    logElement.scrollTop = logElement.scrollHeight;

    console.log(message);
}

function setConnectedState(connected) {
    document.getElementById('connectButton').disabled = connected;
    document.getElementById('disconnectButton').disabled = !connected;
}

function bytesToHex(dataView) {
    const result = [];

    for (let i = 0; i < dataView.byteLength; i++) {
        result.push(
            dataView.getUint8(i)
                .toString(16)
                .padStart(2, '0')
                .toUpperCase()
        );
    }

    return result.join(' ');
}

async function connectSensor() {
    if (!navigator.bluetooth) {
        logMessage('HATA: Web Bluetooth desteklenmiyor.');
        return;
    }

    try {
        logMessage('MJ_HT_V1 sensörü aranıyor...');

        bluetoothDevice =
            await navigator.bluetooth.requestDevice({
                filters: [
                    { name: 'MJ_HT_V1' }
                ],

                optionalServices: [
                    BATTERY_SERVICE_UUID,
                    'device_information'
                ]
            });

        logMessage(
            'Seçilen cihaz: ' +
            (bluetoothDevice.name || 'İsimsiz cihaz')
        );

        bluetoothDevice.addEventListener(
            'gattserverdisconnected',
            handleDisconnected
        );

        bluetoothDevice.addEventListener(
            'advertisementreceived',
            handleAdvertisement
        );

        logMessage('GATT bağlantısı kuruluyor...');

        const server =
            await bluetoothDevice.gatt.connect();

        logMessage('GATT bağlantısı başarılı.');

        setConnectedState(true);

        await readBattery(server);

        if (
            typeof bluetoothDevice.watchAdvertisements === 'function'
        ) {
            logMessage('BLE reklam paketleri dinleniyor...');

            await bluetoothDevice.watchAdvertisements();

            logMessage(
                'Reklam dinleme aktif. Sensörden veri bekleniyor...'
            );
        } else {
            logMessage(
                'HATA: Bu Chrome sürümü watchAdvertisements özelliğini desteklemiyor.'
            );

            logMessage(
                'Bu sensörde sıcaklık ve nem GATT servisinde değil, reklam paketindedir.'
            );
        }

    } catch (error) {
        logMessage(
            `HATA [${error.name || 'Bilinmeyen'}]: ` +
            `${error.message || error}`
        );

        setConnectedState(false);
    }
}

async function readBattery(server) {
    try {
        const batteryService =
            await server.getPrimaryService(
                BATTERY_SERVICE_UUID
            );

        const batteryCharacteristic =
            await batteryService.getCharacteristic(
                BATTERY_CHARACTERISTIC_UUID
            );

        const value =
            await batteryCharacteristic.readValue();

        const battery =
            value.getUint8(0);

        document.getElementById('battery').innerText =
            `% ${battery}`;

        logMessage(`Pil seviyesi: %${battery}`);

    } catch (error) {
        logMessage(
            'Pil seviyesi okunamadı: ' + error.message
        );
    }
}

function handleAdvertisement(event) {
    logMessage('Reklam paketi alındı.');

    logMessage(
        'RSSI: ' +
        (
            event.rssi !== null &&
            event.rssi !== undefined
                ? event.rssi + ' dBm'
                : 'bilinmiyor'
        )
    );

    event.serviceData.forEach((value, uuid) => {
        logMessage(
            `Servis verisi ${uuid}: ${bytesToHex(value)}`
        );

        parseXiaomiServiceData(value);
    });

    event.manufacturerData.forEach((value, companyId) => {
        logMessage(
            `Üretici verisi ${companyId}: ${bytesToHex(value)}`
        );

        parseXiaomiServiceData(value);
    });
}

function parseXiaomiServiceData(value) {
    /*
      MJ_HT_V1 reklam paketlerinin sürüme göre yapısı değişebilir.
      Bu bölüm yaygın Xiaomi MiBeacon veri tiplerini arar.

      0x1004 = sıcaklık
      0x1006 = nem
      0x100A = pil
      0x100D = sıcaklık + nem
    */

    for (let i = 0; i < value.byteLength - 4; i++) {
        const type =
            value.getUint16(i, true);

        const length =
            value.getUint8(i + 2);

        if (type === 0x1004 && length >= 2) {
            const temperature =
                value.getInt16(i + 3, true) / 10;

            document.getElementById('temp').innerText =
                `${temperature.toFixed(1)} °C`;

            logMessage(
                `Sıcaklık bulundu: ${temperature.toFixed(1)} °C`
            );
        }

        if (type === 0x1006 && length >= 2) {
            const humidity =
                value.getUint16(i + 3, true) / 10;

            document.getElementById('humidity').innerText =
                `% ${humidity.toFixed(1)}`;

            logMessage(
                `Nem bulundu: %${humidity.toFixed(1)}`
            );
        }

        if (type === 0x100A && length >= 1) {
            const battery =
                value.getUint8(i + 3);

            document.getElementById('battery').innerText =
                `% ${battery}`;

            logMessage(
                `Pil bulundu: %${battery}`
            );
        }

        if (type === 0x100D && length >= 4) {
            const temperature =
                value.getInt16(i + 3, true) / 10;

            const humidity =
                value.getUint16(i + 5, true) / 10;

            document.getElementById('temp').innerText =
                `${temperature.toFixed(1)} °C`;

            document.getElementById('humidity').innerText =
                `% ${humidity.toFixed(1)}`;

            logMessage(
                `Sıcaklık: ${temperature.toFixed(1)} °C, ` +
                `Nem: %${humidity.toFixed(1)}`
            );
        }
    }
}

function disconnectSensor() {
    if (
        bluetoothDevice &&
        bluetoothDevice.gatt &&
        bluetoothDevice.gatt.connected
    ) {
        bluetoothDevice.gatt.disconnect();
    } else {
        handleDisconnected();
    }
}

function handleDisconnected() {
    logMessage('Cihaz bağlantısı kesildi.');

    setConnectedState(false);

    if (bluetoothDevice) {
        bluetoothDevice.removeEventListener(
            'advertisementreceived',
            handleAdvertisement
        );
    }
}
</script>

</body>
</html>
