<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE IoT Gateway - v1.5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #6f42c1;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #5a32a3;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }
        #data {
            margin-top: 20px;
            font-size: 22px;
            color: #004085;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Xiaomi LYWSD03MMC (ATC) Gateway - v1.5</h2>
    <p>Kapsamlı Servis ve Karakteristik Dökümü</p>
    
    <button onclick="connectAndRead()">Sensöre Bağlan ve Veri Al</button>
    <div id="status">Bağlantı bekleniyor...</div>
    <div id="data"></div>

    <script>
        async function connectAndRead() {
            const statusDiv = document.getElementById("status");
            const dataDiv = document.getElementById("data");

            try {
                statusDiv.innerText = "v1.5: Cihaz taranıyor...";

                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        'ebe0ccc0-7a0a-4b0c-8a1a-6ff2997da3a6',
                        '0000181a-0000-1000-8000-00805f9b34fb',
                        '0000180f-0000-1000-8000-00805f9b34fb',
                        '00001f10-0000-1000-8000-00805f9b34fb',
                        '0000ffe0-0000-1000-8000-00805f9b34fb'
                    ]
                });

                statusDiv.innerText = "v1.5: Bağlantı kuruluyor...";
                
                let server;
                for (let i = 1; i <= 3; i++) {
                    try {
                        if (device.gatt.connected) await device.gatt.disconnect();
                        server = await device.gatt.connect();
                        break;
                    } catch (err) {
                        if (i === 3) throw err;
                        await new Promise(res => setTimeout(res, 2000));
                    }
                }

                statusDiv.innerText = "v1.5: Servisler listeleniyor...";
                const services = await server.getPrimaryServices();
                
                let allCharacteristics = [];

                for (let service of services) {
                    try {
                        const chars = await service.getCharacteristics();
                        for (let char of chars) {
                            allCharacteristics.push(char);
                            console.log("Servis:", service.uuid, "-> Karakteristik:", char.uuid, "Özellikler:", char.properties);
                        }
                    } catch (e) {
                        console.warn("Servis okunamadı:", service.uuid);
                    }
                }

                if (allCharacteristics.length === 0) {
                    throw new Error("Cihaz hiç karakteristik döndürmedi.");
                }

                // Önce notify veya indicate destekleyeni bulmaya çalışalım, yoksa ilkini alalım
                let workingCharacteristic = allCharacteristics.find(c => c.properties.notify || c.properties.indicate) || allCharacteristics[0];

                statusDiv.innerText = "v1.5: Veri akışı dinleniyor...";

                workingCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                    parsePayload(event.target.value, statusDiv, dataDiv);
                });

                try {
                    await workingCharacteristic.startNotifications();
                } catch (err) {
                    console.log("Bildirim başlatılamadı, manuel okuma deneniyor...");
                }

                const initialValue = await workingCharacteristic.readValue();
                parsePayload(initialValue, statusDiv, dataDiv);

            } catch (error) {
                statusDiv.innerText = "v1.5 Hata: " + error.message;
                console.error(error);
            }
        }

        function parsePayload(value, statusDiv, dataDiv) {
            try {
                if (value.byteLength >= 4) {
                    const temp = value.getInt16(0, true) / 100;
                    const hum = value.getUint8(2);
                    const batt = value.getUint8(3);

                    statusDiv.innerText = "v1.5: Veri Akışı Başarılı!";
                    dataDiv.innerHTML = `Sıcaklık: ${temp.toFixed(2)} °C<br>Nem: %${hum}<br>Pil: %${batt}`;
                } else {
                    statusDiv.innerText = "v1.5: Alternatif Veri Alındı";
                    dataDiv.innerHTML = `Ham Boyut: ${value.byteLength} bayt, Hex: ${Array.from(new Uint8Array(value.buffer)).map(b => ('0' + b.toString(16)).slice(-2)).join(' ')}`;
                }
            } catch (e) {
                statusDiv.innerText = "v1.5: Veri çözümlenemedi.";
            }
        }
    </script>

</body>
</html>
