<!-- BLE Explorer v1.0 -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BLE Servis Tarayıcı</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f7;
            color: #222;
        }

        .card {
            max-width: 500px;
            margin: auto;
            padding: 18px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        .version {
            padding: 8px 10px;
            margin-bottom: 15px;
            background: #eeeeee;
            color: #666;
            border-radius: 6px;
            font-size: 13px;
        }

        h2 {
            margin-top: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-bottom: 10px;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
            color: white;
            background: #087ff5;
        }

        button:hover {
            background: #0067d4;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .disconnect {
            background: #d33;
        }

        .disconnect:hover {
            background: #ad1f1f;
        }

        .status {
            margin: 12px 0;
            padding: 10px;
            background: #f1f1f1;
            border-radius: 6px;
            font-size: 14px;
        }

        #log {
            margin-top: 12px;
            padding: 10px;
            min-height: 240px;
            max-height: 500px;
            overflow-y: auto;
            border-radius: 7px;
            background: #111;
            color: #b8ffb8;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="version">
        BLE Explorer Sürümü: v1.0
    </div>

    <h2>BLE Servis Tarayıcı</h2>

    <button
        id="connectButton"
        onclick="connectAndScan()"
    >
        Cihazı Seç ve Tara
    </button>

    <button
        id="disconnectButton"
        class="disconnect"
        onclick="disconnectDevice()"
        disabled
    >
        Bağlantıyı Kes
    </button>

    <div class="status">
        Durum:
        <strong id="statusText">Bağlı değil</strong>
    </div>

    <div id="log">BLE tarama logları burada görünecek...</div>

</div>

<script>
let bluetoothDevice = null;
let gattServer = null;

function logMessage(message = '') {
    const logElement = document.getElementById('log');
    const time = new Date().toLocaleTimeString('tr-TR');

    logElement.innerText += `\n[${time}] ${message}`;
    logElement.scrollTop = logElement.scrollHeight;

    console.log(message);
}

function clearLog() {
    document.getElementById('log').innerText =
        'BLE tarama başlatılıyor...';
}

function setStatus(text) {
    document.getElementById('statusText').innerText = text;
}

function setConnectedState(connected) {
    document.getElementById('connectButton').disabled = connected;
    document.getElementById('disconnectButton').disabled = !connected;
}

function shortUuid(uuid) {
    const normalizedUuid = uuid.toLowerCase();

    if (
        normalizedUuid.startsWith('0000') &&
        normalizedUuid.endsWith('-0000-1000-8000-00805f9b34fb')
    ) {
        return normalizedUuid.substring(4, 8).toUpperCase();
    }

    return uuid;
}

function getCharacteristicProperties(characteristic) {
    const properties = characteristic.properties;
    const list = [];

    if (properties.broadcast) {
        list.push('broadcast');
    }

    if (properties.read) {
        list.push('read');
    }

    if (properties.writeWithoutResponse) {
        list.push('writeWithoutResponse');
    }

    if (properties.write) {
        list.push('write');
    }

    if (properties.notify) {
        list.push('notify');
    }

    if (properties.indicate) {
        list.push('indicate');
    }

    if (properties.authenticatedSignedWrites) {
        list.push('authenticatedSignedWrites');
    }

    if (properties.reliableWrite) {
        list.push('reliableWrite');
    }

    if (properties.writableAuxiliaries) {
        list.push('writableAuxiliaries');
    }

    return list.length > 0
        ? list.join(', ')
        : 'özellik bulunamadı';
}

function dataViewToHex(dataView) {
    const values = [];

    for (let i = 0; i < dataView.byteLength; i++) {
        values.push(
            dataView
                .getUint8(i)
                .toString(16)
                .padStart(2, '0')
                .toUpperCase()
        );
    }

    return values.join(' ');
}

async function connectAndScan() {
    if (!navigator.bluetooth) {
        logMessage(
            'HATA: Bu tarayıcı Web Bluetooth desteklemiyor.'
        );

        logMessage(
            'Android Chrome veya masaüstü Chrome/Edge kullanın.'
        );

        return;
    }

    try {
        clearLog();

        setStatus('Cihaz seçimi bekleniyor');

        logMessage('Bluetooth cihaz listesi açılıyor...');

        /*
         * acceptAllDevices kullanıldığında erişmek istediğimiz
         * özel servisler optionalServices içinde belirtilmelidir.
         *
         * Xiaomi cihazlarında görülebilecek yaygın servisler
         * aşağıda eklenmiştir.
         */
        bluetoothDevice =
            await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,

                optionalServices: [
                    'generic_access',
                    'generic_attribute',
                    'device_information',
                    'battery_service',
                    'environmental_sensing',

                    '00001800-0000-1000-8000-00805f9b34fb',
                    '00001801-0000-1000-8000-00805f9b34fb',
                    '0000180a-0000-1000-8000-00805f9b34fb',
                    '0000180f-0000-1000-8000-00805f9b34fb',
                    '0000181a-0000-1000-8000-00805f9b34fb',

                    'ebe0ccb0-7a0a-4b0c-8a1a-6ff2997da3a6',
                    'ebe0ccc0-7a0a-4b0c-8a1a-6ff2997da3a6',
                    '00001f10-0000-1000-8000-00805f9b34fb'
                ]
            });

        bluetoothDevice.addEventListener(
            'gattserverdisconnected',
            handleDisconnected
        );

        const deviceName =
            bluetoothDevice.name || 'İsimsiz BLE cihazı';

        logMessage(`Seçilen cihaz: ${deviceName}`);
        logMessage(`Cihaz kimliği: ${bluetoothDevice.id}`);

        setStatus('GATT bağlantısı kuruluyor');

        logMessage('GATT sunucusuna bağlanılıyor...');

        gattServer =
            await bluetoothDevice.gatt.connect();

        logMessage('GATT bağlantısı başarılı.');

        setConnectedState(true);
        setStatus(`Bağlı: ${deviceName}`);

        logMessage('');
        logMessage('Servisler aranıyor...');

        const services =
            await gattServer.getPrimaryServices();

        logMessage(
            `Erişilebilen servis sayısı: ${services.length}`
        );

        if (services.length === 0) {
            logMessage(
                'UYARI: Erişilebilir servis bulunamadı.'
            );
            return;
        }

        for (
            let serviceIndex = 0;
            serviceIndex < services.length;
            serviceIndex++
        ) {
            const service = services[serviceIndex];

            logMessage('');
            logMessage(
                '========================================'
            );

            logMessage(
                `SERVİS ${serviceIndex + 1}`
            );

            logMessage(
                `Tam UUID: ${service.uuid}`
            );

            logMessage(
                `Kısa UUID: ${shortUuid(service.uuid)}`
            );

            try {
                const characteristics =
                    await service.getCharacteristics();

                logMessage(
                    `Karakteristik sayısı: ${characteristics.length}`
                );

                for (
                    let characteristicIndex = 0;
                    characteristicIndex < characteristics.length;
                    characteristicIndex++
                ) {
                    const characteristic =
                        characteristics[characteristicIndex];

                    logMessage('');
                    logMessage(
                        `  Karakteristik ${characteristicIndex + 1}`
                    );

                    logMessage(
                        `  Tam UUID: ${characteristic.uuid}`
                    );

                    logMessage(
                        `  Kısa UUID: ${shortUuid(characteristic.uuid)}`
                    );

                    logMessage(
                        `  Özellikler: ${getCharacteristicProperties(characteristic)}`
                    );

                    if (characteristic.properties.read) {
                        try {
                            const value =
                                await characteristic.readValue();

                            logMessage(
                                `  Okunan veri: ${dataViewToHex(value)}`
                            );
                        } catch (readError) {
                            logMessage(
                                `  Okuma başarısız: ${readError.message}`
                            );
                        }
                    }

                    if (characteristic.properties.notify) {
                        logMessage(
                            '  Bildirim özelliği mevcut.'
                        );
                    }

                    if (characteristic.properties.indicate) {
                        logMessage(
                            '  Indicate özelliği mevcut.'
                        );
                    }
                }

            } catch (characteristicError) {
                logMessage(
                    'Karakteristikler okunamadı: ' +
                    characteristicError.message
                );
            }
        }

        logMessage('');
        logMessage(
            '========================================'
        );

        logMessage('Tarama tamamlandı.');

    } catch (error) {
        setConnectedState(false);
        setStatus('Bağlantı başarısız');

        if (error.name === 'NotFoundError') {
            logMessage(
                'İşlem iptal edildi veya cihaz seçilmedi.'
            );

        } else if (error.name === 'SecurityError') {
            logMessage(
                'Güvenlik hatası: Sayfa HTTPS üzerinden açılmalıdır.'
            );

        } else if (error.name === 'NetworkError') {
            logMessage(
                'GATT bağlantısı kurulamadı.'
            );

            logMessage(
                'Cihaz başka bir uygulamaya bağlı olabilir.'
            );

        } else {
            logMessage(
                `HATA [${error.name || 'Bilinmeyen'}]: ` +
                `${error.message || error}`
            );
        }

        if (
            bluetoothDevice &&
            bluetoothDevice.gatt &&
            bluetoothDevice.gatt.connected
        ) {
            bluetoothDevice.gatt.disconnect();
        }
    }
}

function disconnectDevice() {
    if (
        bluetoothDevice &&
        bluetoothDevice.gatt &&
        bluetoothDevice.gatt.connected
    ) {
        bluetoothDevice.gatt.disconnect();
    } else {
        handleDisconnected();
    }
}

function handleDisconnected() {
    logMessage('Cihaz bağlantısı kesildi.');

    gattServer = null;

    setConnectedState(false);
    setStatus('Bağlı değil');
}
</script>

</body>
</html>
