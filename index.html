<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE IoT Gateway - Sensör Verisi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
        #data {
            margin-top: 15px;
            font-size: 18px;
            color: #006400;
        }
    </style>
</head>
<body>

    <h2>Xiaomi LYWSD03MMC Sensör Okuma</h2>
    <p>Esnek Servis Tarama Arayüzü</p>
    
    <button onclick="connectSensor()">Sensöre Bağlan ve Oku</button>
    <div id="status">Bağlantı bekleniyor...</div>
    <div id="data"></div>

    <script>
        async function connectSensor() {
            const statusDiv = document.getElementById("status");
            const dataDiv = document.getElementById("data");
            
            try {
                statusDiv.innerText = "Cihaz taranıyor...";
                
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        'ebe0ccc0-7a0a-4b0c-8a1a-6ff2997da3a6',
                        '00001800-0000-1000-8000-00805f9b34fb',
                        '00001801-0000-1000-8000-00805f9b34fb',
                        '0000181a-0000-1000-8000-00805f9b34fb',
                        '0000ffe0-0000-1000-8000-00805f9b34fb'
                    ]
                });

                statusDiv.innerText = "Cihaz seçildi, bağlanılıyor...";
                
                let server = null;
                for (let i = 1; i <= 3; i++) {
                    try {
                        if (device.gatt.connected) await device.gatt.disconnect();
                        server = await device.gatt.connect();
                        break;
                    } catch (err) {
                        if (i === 3) throw err;
                        await new Promise(res => setTimeout(res, 2000));
                    }
                }

                statusDiv.innerText = "Servisler taranıyor...";
                const services = await server.getPrimaryServices();
                
                let targetCharacteristic = null;

                // Tüm servisleri ve altındaki karakteristikleri tarayarak bildirim destekleyeni bulalım
                for (let service of services) {
                    try {
                        const characteristics = await service.getCharacteristics();
                        for (let characteristic of characteristics) {
                            if (characteristic.properties.notify || characteristic.properties.indicate) {
                                targetCharacteristic = characteristic;
                                console.log("Uygun karakteristik bulundu:", characteristic.uuid);
                                break;
                            }
                        }
                    } catch (e) {
                        console.warn("Servis taranamadı:", service.uuid);
                    }
                    if (targetCharacteristic) break;
                }

                if (!targetCharacteristic && services.length > 0) {
                    const chars = await services[0].getCharacteristics();
                    if (chars.length > 0) targetCharacteristic = chars[0];
                }

                if (!targetCharacteristic) {
                    throw new Error("Okunabilir karakteristik bulunamadı.");
                }

                statusDiv.innerText = "Bildirimler başlatılıyor...";
                await targetCharacteristic.startNotifications();
                
                targetCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = event.target.value;
                    try {
                        if (value.byteLength >= 4) {
                            const temp = value.getInt16(0, true) / 100;
                            const hum = value.getUint8(2);
                            const batt = value.getUint8(3);
                            
                            statusDiv.innerText = "Veri Akışı Aktif!";
                            dataDiv.innerHTML = `Sıcaklık: ${temp.toFixed(2)} °C<br>Nem: %${hum}<br>Pil: %${batt}`;
                        } else {
                            statusDiv.innerText = "Veri alındı (Farklı format)";
                            dataDiv.innerHTML = `Boyut: ${value.byteLength} bayt`;
                        }
                    } catch (e) {
                        statusDiv.innerText = "Veri çözümlenemedi.";
                    }
                });

                statusDiv.innerText = "Bağlantı Başarılı! Veri bekleniyor...";

            } catch (error) {
                statusDiv.innerText = "Hata oluştu: " + error.message;
                console.error(error);
            }
        }
    </script>

</body>
</html>
