<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE IoT Gateway - Kesin Çözüm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #218838;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }
        #data {
            margin-top: 20px;
            font-size: 22px;
            color: #004085;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Xiaomi LYWSD03MMC (ATC) Gateway</h2>
    <p>Doğrudan Karakteristik Tarayıcı</p>
    
    <button onclick="startScan()">Sensöre Bağlan ve Veri Al</button>
    <div id="status">Bağlantı bekleniyor...</div>
    <div id="data"></div>

    <script>
        const ATC_SERVICE_UUID = 'ebe0ccc0-7a0a-4b0c-8a1a-6ff2997da3a6';
        const ATC_CHAR_UUID    = 'ebe0ccc1-7a0a-4b0c-8a1a-6ff2997da3a6';

        async function startScan() {
            const statusDiv = document.getElementById("status");
            const dataDiv = document.getElementById("data");

            try {
                statusDiv.innerText = "Cihaz taranıyor, lütfen listeden seçin...";

                // Bluetooth cihaz seçimi
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [ATC_SERVICE_UUID]
                });

                statusDiv.innerText = "Bağlantı kuruluyor...";
                
                // Android önbellek çakışmasını engellemek için bağlantı denemesi
                let server;
                for (let attempt = 1; attempt <= 3; attempt++) {
                    try {
                        if (device.gatt.connected) {
                            await device.gatt.disconnect();
                        }
                        server = await device.gatt.connect();
                        break;
                    } catch (err) {
                        if (attempt === 3) throw err;
                        await new Promise(res => setTimeout(res, 1500));
                    }
                }

                statusDiv.innerText = "ATC Servisi aranıyor...";
                
                // Doğrudan servisi istemek yerine tüm servisleri alıp arıyoruz (Android cache hatasını önler)
                const services = await server.getPrimaryServices();
                let targetService = null;

                for (let service of services) {
                    if (service.uuid.toLowerCase() === ATC_SERVICE_UUID.toLowerCase()) {
                        targetService = service;
                        break;
                    }
                }

                // Eğer özel servis UUID eşleşmezse ilk servisi zorla kullan
                if (!targetService) {
                    targetService = services[0];
                }

                statusDiv.innerText = "Karakteristikler taranıyor...";
                const characteristics = await targetService.getCharacteristics();
                let targetChar = null;

                for (let char of characteristics) {
                    if (char.uuid.toLowerCase() === ATC_CHAR_UUID.toLowerCase()) {
                        targetChar = char;
                        break;
                    }
                }

                // UUID uyuşmazsa notify destekleyen ilk karakteristiği seç
                if (!targetChar) {
                    for (let char of characteristics) {
                        if (char.properties.notify || char.properties.read) {
                            targetChar = char;
                            break;
                        }
                    }
                }

                if (!targetChar) {
                    throw new Error("Uygun karakteristik bulunamadı.");
                }

                statusDiv.innerText = "Bildirimler başlatılıyor...";
                
                targetChar.addEventListener('characteristicvaluechanged', (event) => {
                    parseData(event.target.value, statusDiv, dataDiv);
                });

                await targetChar.startNotifications();
                
                // İlk veriyi anında tetikle
                const initialVal = await targetChar.readValue();
                parseData(initialVal, statusDiv, dataDiv);

            } catch (error) {
                statusDiv.innerText = "Hata: " + error.message;
                console.error(error);
            }
        }

        function parseData(value, statusDiv, dataDiv) {
            try {
                // ATC formatı genellikle ilk 2 bayt sıcaklık, 3. bayt nem, 4. bayt pil şeklindedir
                if (value.byteLength >= 4) {
                    const temp = value.getInt16(0, true) / 100;
                    const hum = value.getUint8(2);
                    const batt = value.getUint8(3);

                    statusDiv.innerText = "Veri Akışı Aktif (Canlı)";
                    dataDiv.innerHTML = `Sıcaklık: ${temp.toFixed(2)} °C<br>Nem: %${hum}<br>Pil: %${batt}`;
                } else {
                    statusDiv.innerText = "Veri alındı (Farklı format)";
                    dataDiv.innerHTML = `Ham Uzunluk: ${value.byteLength} bayt`;
                }
            } catch (e) {
                statusDiv.innerText = "Veri okundu ancak çözümlenemedi.";
            }
        }
    </script>

</body>
</html>
