<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE IoT Gateway - Sensör Bağlantısı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Xiaomi LYWSD03MMC Web Bluetooth Bağlantısı</h2>
    <p>ATC Firmware servis UUID uyumsuzluğunu aşmak için güncellenmiş arayüz.</p>
    
    <button onclick="connectSensor()">Sensöre Bağlan</button>
    <div id="status">Bağlantı bekleniyor...</div>

    <script>
        async function connectSensor() {
            const statusDiv = document.getElementById("status");
            try {
                statusDiv.innerText = "Cihaz taranıyor...";
                console.log("Cihaz taranıyor...");
                
                // Tüm cihazları kabul et ve ATC/Custom firmware için yaygın servis UUID'lerini optionalServices listesine ekle
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '0000181a-0000-1000-8000-00805f9b34fb', // Environmental Sensing
                        'ebe0ccc0-7a0a-4b0c-8a1a-6ff2997da3a6', // ATC / PVVX Custom Service
                        '0000ffe0-0000-1000-8000-00805f9b34fb'  // Telink Custom Service
                    ]
                });

                statusDiv.innerText = "Cihaz seçildi: " + (device.name || "İsimsiz Cihaz");
                console.log("Cihaz seçildi:", device.name);
                
                // GATT sunucusuna doğrudan bağlantı talebi
                const server = await device.gatt.connect();
                statusDiv.innerText = "GATT Sunucusuna başarıyla bağlanıldı.";
                console.log("GATT Sunucusuna başarıyla bağlanıldı.");

                // Cihazın sunduğu servisleri bulmaya çalışalım
                statusDiv.innerText = "Servisler taranıyor...";
                const services = await server.getPrimaryServices();
                
                let targetService = null;
                for (const service of services) {
                    console.log("Bulunan Servis UUID:", service.uuid);
                    // ATC firmware için kullanılan ana özel servis UUID kontrolü
                    if (service.uuid === 'ebe0ccc0-7a0a-4b0c-8a1a-6ff2997da3a6' || service.uuid === '0000181a-0000-1000-8000-00805f9b34fb') {
                        targetService = service;
                        break;
                    }
                }

                // Eğer özel servis bulunamazsa ilk servisi baz al
                if (!targetService && services.length > 0) {
                    targetService = services[0];
                }

                if (targetService) {
                    statusDiv.innerText = "Uygun servise ulaşıldı: " + targetService.uuid;
                    console.log("Ulaşılan Servis UUID:", targetService.uuid);
                } else {
                    throw new Error("Cihaz üzerinde uygun GATT servisi bulunamadı.");
                }
                
            } catch (error) {
                statusDiv.innerText = "Hata oluştu: " + error.message;
                console.error("Bağlantı reddedildi veya hata oluştu:", error);
            }
        }
    </script>

</body>
</html>
