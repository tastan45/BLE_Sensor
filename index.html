<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE IoT Gateway - Sensör Bağlantısı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Xiaomi LYWSD03MMC Web Bluetooth Bağlantısı</h2>
    <p>Bluetooth önbellek sorununu aşan güncellenmiş arayüz.</p>
    
    <button onclick="connectSensor()">Sensöre Bağlan</button>
    <div id="status">Bağlantı bekleniyor...</div>

    <script>
        async function connectSensor() {
            const statusDiv = document.getElementById("status");
            try {
                // Eğer tarayıcıda önceden kalan eşleşme varsa temizlik uyarısı
                statusDiv.innerText = "Eski eşleşmeler kontrol ediliyor...";
                console.log("Bluetooth tarama isteği başlatılıyor...");
                
                // Tarayıcı önbelleğinin eski servisleri dayatmasını engellemek için genişletilmiş parametreler
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        'ebe0ccc0-7a0a-4b0c-8a1a-6ff2997da3a6', 
                        '0000181a-0000-1000-8000-00805f9b34fb',
                        '0000ffe0-0000-1000-8000-00805f9b34fb'
                    ]
                });

                statusDiv.innerText = "Cihaz seçildi: " + (device.name || "İsimsiz Cihaz");
                console.log("Seçilen cihaz:", device.name, device.id);

                // Bağlantı kopmaları veya eski oturumlar için dinleyici ekleyelim
                device.addEventListener('gattserverdisconnected', onDisconnected);

                statusDiv.innerText = "GATT sunucusuna bağlanılıyor...";
                const server = await device.gatt.connect();
                
                statusDiv.innerText = "Servisler keşfediliyor...";
                const services = await server.getPrimaryServices();
                console.log("Keşfedilen servis sayısı:", services.length);

                if (services.length > 0) {
                    statusDiv.innerText = "Bağlantı Başarılı! Servis UUID: " + services[0].uuid;
                    console.log("Aktif Servis UUID:", services[0].uuid);
                } else {
                    throw new Error("Cihaz GATT servis listesi döndürmedi.");
                }
                
            } catch (error) {
                statusDiv.innerText = "Hata oluştu: " + error.message;
                console.error("Bağlantı hatası detayı:", error);
            }
        }

        function onDisconnected(event) {
            const device = event.target;
            console.log(`Cihaz bağlantısı koptu: ${device.name}`);
            document.getElementById("status").innerText = "Bağlantı koptu. Yeniden bağlanabilirsiniz.";
        }
    </script>

</body>
</html>
