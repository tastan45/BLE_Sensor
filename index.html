<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE IoT Gateway - Sensör Bağlantısı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Xiaomi LYWSD03MMC Web Bluetooth Bağlantısı</h2>
    <p>Servis UUID zorunluluğunu kaldıran dinamik tarama arayüzü.</p>
    
    <button onclick="connectSensor()">Sensöre Bağlan</button>
    <div id="status">Bağlantı bekleniyor...</div>

    <script>
        async function connectSensor() {
            const statusDiv = document.getElementById("status");
            try {
                statusDiv.innerText = "Cihaz taranıyor...";
                console.log("Cihaz taranıyor...");
                
                // Servis filtrelemesini tamamen devre dışı bırakarak hatayı kökten önleyelim
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['ebe0ccc0-7a0a-4b0c-8a1a-6ff2997da3a6', '0000181a-0000-1000-8000-00805f9b34fb']
                });

                statusDiv.innerText = "Cihaz seçildi: " + (device.name || "İsimsiz Cihaz");
                console.log("Cihaz seçildi:", device.name);
                
                // GATT sunucusuna bağlan
                const server = await device.gatt.connect();
                statusDiv.innerText = "GATT Sunucusuna bağlandı, servisler listeleniyor...";
                console.log("GATT Sunucusuna başarıyla bağlanıldı.");

                // Cihazın sunduğu tüm servisleri doğrudan alıp listeyle eşgeçelim
                const services = await server.getPrimaryServices();
                console.log("Bulunan toplam servis sayısı:", services.length);

                if (services.length > 0) {
                    // İlk erişilebilir servisi hedef olarak seç
                    const targetService = services[0];
                    statusDiv.innerText = "Aktif Servis: " + targetService.uuid;
                    console.log("Kullanılan Servis UUID:", targetService.uuid);

                    // Karakteristikleri listeleyerek veri okuma kapısını açalım
                    const characteristics = await targetService.getCharacteristics();
                    console.log("Bulunan karakteristik sayısı:", characteristics.length);
                    statusDiv.innerText = "Bağlantı ve Servis Keşfi Başarılı! Karakteristik sayısı: " + characteristics.length;
                } else {
                    throw new Error("Cihaz hiçbir GATT servisi döndürmedi.");
                }
                
            } catch (error) {
                statusDiv.innerText = "Hata oluştu: " + error.message;
                console.error("Bağlantı hatası:", error);
            }
        }
    </script>

</body>
</html>
