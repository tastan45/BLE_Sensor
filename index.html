<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE IoT Gateway - v1.8</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
            background-color: #f4f4f9;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #c9302c;
        }
        .version-box {
            font-size: 16px;
            color: #fff;
            background-color: #333;
            padding: 6px 12px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: bold;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }
        #data {
            margin-top: 20px;
            font-size: 22px;
            color: #004085;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="version-box">Arayüz Sürümü: v1.8</div>
    <h2>Xiaomi LYWSD03MMC (ATC) Gateway</h2>
    <p>Doğrudan Servis ve Karakteristik Indeksleme</p>
    
    <button onclick="connectAndRead()">Sensöre Bağlan ve Veri Al</button>
    <div id="status">Bağlantı bekleniyor...</div>
    <div id="data"></div>

    <script>
        async function connectAndRead() {
            const statusDiv = document.getElementById("status");
            const dataDiv = document.getElementById("data");

            try {
                statusDiv.innerText = "v1.8: Cihaz taranıyor...";

                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        'ebe0ccc0-7a0a-4b0c-8a1a-6ff2997da3a6',
                        '0000181a-0000-1000-8000-00805f9b34fb',
                        '0000180f-0000-1000-8000-00805f9b34fb',
                        '0000ffe0-0000-1000-8000-00805f9b34fb'
                    ]
                });

                statusDiv.innerText = "v1.8: Bağlantı kuruluyor...";
                
                let server;
                for (let i = 1; i <= 3; i++) {
                    try {
                        if (device.gatt.connected) await device.gatt.disconnect();
                        server = await device.gatt.connect();
                        break;
                    } catch (err) {
                        if (i === 3) throw err;
                        await new Promise(res => setTimeout(res, 2000));
                    }
                }

                statusDiv.innerText = "v1.8: Tüm servisler okunuyor...";
                const services = await server.getPrimaryServices();
                
                let validChar = null;

                for (let service of services) {
                    try {
                        const chars = await service.getCharacteristics();
                        for (let char of chars) {
                            console.log("UUID:", char.uuid, "Props:", char.properties);
                            if (char.properties.notify || char.properties.indicate || char.properties.read) {
                                validChar = char;
                                break;
                            }
                        }
                    } catch (err) {
                        console.warn("Servis okunamadı:", service.uuid);
                    }
                    if (validChar) break;
                }

                // Eğer yukarıdaki döngüde yakalanamazsa, ilk servisin ilk karakteristiğini zorla al
                if (!validChar && services.length > 0) {
                    try {
                        const fallbackChars = await services[0].getCharacteristics();
                        if (fallbackChars.length > 0) {
                            validChar = fallbackChars[0];
                        }
                    } catch (e) {
                        console.error("Fallback hata:", e);
                    }
                }

                if (!validChar) {
                    throw new Error("v1.8: Cihaz GATT tablosu boş veya erişilemiyor.");
                }

                statusDiv.innerText = "v1.8: Veri akışı dinleniyor...";

                validChar.addEventListener('characteristicvaluechanged', (event) => {
                    parsePayload(event.target.value, statusDiv, dataDiv);
                });

                try {
                    await validChar.startNotifications();
                } catch (err) {
                    console.log("v1.8: Bildirim açılamadı, okuma yapılıyor...");
                }

                const initialValue = await validChar.readValue();
                parsePayload(initialValue, statusDiv, dataDiv);

            } catch (error) {
                statusDiv.innerText = "v1.8 Hata: " + error.message;
                console.error(error);
            }
        }

        function parsePayload(value, statusDiv, dataDiv) {
            try {
                if (value.byteLength >= 4) {
                    const temp = value.getInt16(0, true) / 100;
                    const hum = value.getUint8(2);
                    const batt = value.getUint8(3);

                    statusDiv.innerText = "v1.8: Veri Akışı Başarılı!";
                    dataDiv.innerHTML = `Sıcaklık: ${temp.toFixed(2)} °C<br>Nem: %${hum}<br>Pil: %${batt}`;
                } else {
                    statusDiv.innerText = "v1.8: Ham Veri Alındı";
                    dataDiv.innerHTML = `Boyut: ${value.byteLength} bayt, Hex: ${Array.from(new Uint8Array(value.buffer)).map(b => ('0' + b.toString(16)).slice(-2)).join(' ')}`;
                }
            } catch (e) {
                statusDiv.innerText = "v1.8: Veri çözümlenemedi.";
            }
        }
    </script>

</body>
</html>
