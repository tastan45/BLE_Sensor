<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE IoT Gateway - v1.7</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #218838;
        }
        #version-badge {
            font-size: 14px;
            color: #fff;
            background-color: #dc3545;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }
        #data {
            margin-top: 20px;
            font-size: 22px;
            color: #004085;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="version-badge">Sürüm: v1.7</div>
    <h2>Xiaomi LYWSD03MMC (ATC) Gateway</h2>
    <p>Garantili Karakteristik ve Servis Eşleme</p>
    
    <button onclick="connectAndRead()">Sensöre Bağlan ve Veri Al</button>
    <div id="status">Bağlantı bekleniyor...</div>
    <div id="data"></div>

    <script>
        async function connectAndRead() {
            const statusDiv = document.getElementById("status");
            const dataDiv = document.getElementById("data");

            try {
                statusDiv.innerText = "v1.7: Cihaz taranıyor...";

                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        'ebe0ccc0-7a0a-4b0c-8a1a-6ff2997da3a6',
                        '00001800-0000-1000-8000-00805f9b34fb',
                        '00001801-0000-1000-8000-00805f9b34fb',
                        '0000181a-0000-1000-8000-00805f9b34fb',
                        '0000ffe0-0000-1000-8000-00805f9b34fb'
                    ]
                });

                statusDiv.innerText = "v1.7: Bağlantı kuruluyor...";
                
                let server;
                for (let i = 1; i <= 3; i++) {
                    try {
                        if (device.gatt.connected) await device.gatt.disconnect();
                        server = await device.gatt.connect();
                        break;
                    } catch (err) {
                        if (i === 3) throw err;
                        await new Promise(res => setTimeout(res, 2000));
                    }
                }

                statusDiv.innerText = "v1.7: Tüm servisler taranıyor...";
                
                let targetChar = null;

                // Yöntem 1: Doğrudan ATC özel servis UUID'sini dene
                try {
                    const atcService = await server.getPrimaryService('ebe0ccc0-7a0a-4b0c-8a1a-6ff2997da3a6');
                    targetChar = await atcService.getCharacteristic('ebe0ccc1-7a0a-4b0c-8a1a-6ff2997da3a6');
                } catch (e) {
                    console.log("v1.7: ATC özel servisi doğrudan bulunamadı, genel taramaya geçiliyor...");
                }

                // Yöntem 2: Bulunamadıysa cihazdaki tüm servisleri ve karakteristikleri dolaş
                if (!targetChar) {
                    const services = await server.getPrimaryServices();
                    for (let service of services) {
                        try {
                            const chars = await service.getCharacteristics();
                            for (let char of chars) {
                                if (char.properties.notify || char.properties.indicate || char.properties.read) {
                                    targetChar = char;
                                    break;
                                }
                            }
                        } catch (err) {
                            console.warn("Servis okunamadı:", service.uuid);
                        }
                        if (targetChar) break;
                    }
                }

                // Yöntem 3: Hala bulunamadıysa ilk servisin ilk karakteristik zorla alınır
                if (!targetChar) {
                    const services = await server.getPrimaryServices();
                    if (services.length > 0) {
                        const chars = await services[0].getCharacteristics();
                        if (chars.length > 0) {
                            targetChar = chars[0];
                        }
                    }
                }

                if (!targetChar) {
                    throw new Error("v1.7: Kesin olarak hiçbir karakteristik çözülemedi.");
                }

                statusDiv.innerText = "v1.7: Veri akışı dinleniyor...";

                targetChar.addEventListener('characteristicvaluechanged', (event) => {
                    parsePayload(event.target.value, statusDiv, dataDiv);
                });

                try {
                    await targetChar.startNotifications();
                } catch (err) {
                    console.log("v1.7: Bildirim başlatılamadı, manuel okuma deneniyor...");
                }

                const initialValue = await targetChar.readValue();
                parsePayload(initialValue, statusDiv, dataDiv);

            } catch (error) {
                statusDiv.innerText = "v1.7 Hata: " + error.message;
                console.error(error);
            }
        }

        function parsePayload(value, statusDiv, dataDiv) {
            try {
                if (value.byteLength >= 4) {
                    const temp = value.getInt16(0, true) / 100;
                    const hum = value.getUint8(2);
                    const batt = value.getUint8(3);

                    statusDiv.innerText = "v1.7: Veri Akışı Başarılı!";
                    dataDiv.innerHTML = `Sıcaklık: ${temp.toFixed(2)} °C<br>Nem: %${hum}<br>Pil: %${batt}`;
                } else {
                    statusDiv.innerText = "v1.7: Alternatif Veri Alındı";
                    dataDiv.innerHTML = `Ham Boyut: ${value.byteLength} bayt, Hex: ${Array.from(new Uint8Array(value.buffer)).map(b => ('0' + b.toString(16)).slice(-2)).join(' ')}`;
                }
            } catch (e) {
                statusDiv.innerText = "v1.7: Veri çözümlenemedi.";
            }
        }
    </script>

</body>
</html>
