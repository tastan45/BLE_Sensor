<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE IoT Gateway - Sensör Verisi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
        #data {
            margin-top: 15px;
            font-size: 18px;
            color: #006400;
        }
    </style>
</head>
<body>

    <h2>Xiaomi LYWSD03MMC Sensör Okuma</h2>
    <p>Dinamik Servis Eşleme Arayüzü</p>
    
    <button onclick="connectSensor()">Sensöre Bağlan ve Oku</button>
    <div id="status">Bağlantı bekleniyor...</div>
    <div id="data"></div>

    <script>
        const TARGET_SERVICE_UUID = 'ebe0ccc0-7a0a-4b0c-8a1a-6ff2997da3a6';
        const TARGET_CHAR_UUID = 'ebe0ccc1-7a0a-4b0c-8a1a-6ff2997da3a6';

        async function connectSensor() {
            const statusDiv = document.getElementById("status");
            const dataDiv = document.getElementById("data");
            
            try {
                statusDiv.innerText = "Cihaz taranıyor...";
                
                // Android önbellek ve servis gizleme sorununu aşmak için kapsamlı optionalServices listesi
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        TARGET_SERVICE_UUID,
                        '00001800-0000-1000-8000-00805f9b34fb',
                        '00001801-0000-1000-8000-00805f9b34fb',
                        '0000181a-0000-1000-8000-00805f9b34fb',
                        '0000ffe0-0000-1000-8000-00805f9b34fb'
                    ]
                });

                statusDiv.innerText = "Cihaz seçildi, bağlanılıyor...";
                
                let server = null;
                for (let i = 1; i <= 3; i++) {
                    try {
                        if (device.gatt.connected) await device.gatt.disconnect();
                        server = await device.gatt.connect();
                        break;
                    } catch (err) {
                        if (i === 3) throw err;
                        await new Promise(res => setTimeout(res, 2000));
                    }
                }

                statusDiv.innerText = "Servisler taranıyor...";
                const services = await server.getPrimaryServices();
                
                let targetService = null;
                for (let service of services) {
                    if (service.uuid.toLowerCase() === TARGET_SERVICE_UUID.toLowerCase()) {
                        targetService = service;
                        break;
                    }
                }

                // Eğer özel servis doğrudan bulunamazsa ilk servisi yedek olarak alıp devam edelim
                if (!targetService && services.length > 0) {
                    console.warn("Özel servis doğrudan eşleşmedi, mevcut ilk servis kullanılıyor.");
                    targetService = services[0];
                }

                if (!targetService) {
                    throw new Error("Cihaz üzerinde uygun servis bulunamadı.");
                }

                statusDiv.innerText = "Karakteristik aranıyor...";
                const characteristics = await targetService.getCharacteristics();
                let targetChar = null;

                for (let characteristic of characteristics) {
                    if (characteristic.uuid.toLowerCase() === TARGET_CHAR_UUID.toLowerCase()) {
                        targetChar = characteristic;
                        break;
                    }
                }

                if (!targetChar && characteristics.length > 0) {
                    targetChar = characteristics[0];
                }

                if (!targetChar) {
                    throw new Error("Uygun karakteristik bulunamadı.");
                }

                await targetChar.startNotifications();
                targetChar.addEventListener('characteristicvaluechanged', (event) => {
                    const value = event.target.value;
                    try {
                        const temp = value.getInt16(0, true) / 100;
                        const hum = value.getUint8(2);
                        const batt = value.getUint8(3);
                        
                        statusDiv.innerText = "Bağlantı Başarılı ve Veri Alınıyor!";
                        dataDiv.innerHTML = `Sıcaklık: ${temp.toFixed(2)} °C<br>Nem: %${hum}<br>Pil: %${batt}`;
                    } catch (e) {
                        statusDiv.innerText = "Veri okundu ancak format çözülemedi.";
                        dataDiv.innerHTML = `Ham Boyut: ${value.byteLength} bayt`;
                    }
                });

                statusDiv.innerText = "Veri akışı bekleniyor (Sensörü tetikleyin)...";

            } catch (error) {
                statusDiv.innerText = "Hata oluştu: " + error.message;
                console.error(error);
            }
        }
    </script>

</body>
</html>
