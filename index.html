<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE IoT Gateway - Sensör Verisi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
        #data {
            margin-top: 15px;
            font-size: 18px;
            color: #006400;
        }
    </style>
</head>
<body>

    <h2>Xiaomi LYWSD03MMC Sensör Okuma</h2>
    <p>Kesin ATC Servis Bağlantısı</p>
    
    <button onclick="connectSensor()">Sensöre Bağlan ve Oku</button>
    <div id="status">Bağlantı bekleniyor...</div>
    <div id="data"></div>

    <script>
        const ATC_SERVICE_UUID = 'ebe0ccc0-7a0a-4b0c-8a1a-6ff2997da3a6';
        const ATC_DATA_CHAR_UUID = 'ebe0ccc1-7a0a-4b0c-8a1a-6ff2997da3a6';

        async function connectSensor() {
            const statusDiv = document.getElementById("status");
            const dataDiv = document.getElementById("data");
            
            try {
                statusDiv.innerText = "Cihaz taranıyor...";
                
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [ATC_SERVICE_UUID]
                });

                statusDiv.innerText = "Cihaz seçildi, bağlanılıyor...";
                
                let server = null;
                for (let i = 1; i <= 3; i++) {
                    try {
                        if (device.gatt.connected) await device.gatt.disconnect();
                        server = await device.gatt.connect();
                        break;
                    } catch (err) {
                        if (i === 3) throw err;
                        await new Promise(res => setTimeout(res, 2000));
                    }
                }

                statusDiv.innerText = "ATC özel servisi aranıyor...";
                const service = await server.getPrimaryService(ATC_SERVICE_UUID);
                
                statusDiv.innerText = "Karakteristik okunuyor...";
                const characteristic = await service.getCharacteristic(ATC_DATA_CHAR_UUID);
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = event.target.value;
                    const temp = value.getInt16(0, true) / 100;
                    const hum = value.getUint8(2);
                    const batt = value.getUint8(3);
                    
                    statusDiv.innerText = "Bağlantı Başarılı ve Veri Alınıyor!";
                    dataDiv.innerHTML = `Sıcaklık: ${temp.toFixed(2)} °C<br>Nem: %${hum}<br>Pil: %${batt}`;
                });

                statusDiv.innerText = "Veri akışı bekleniyor...";

            } catch (error) {
                statusDiv.innerText = "Hata oluştu: " + error.message;
                console.error(error);
            }
        }
    </script>

</body>
</html>
